<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up – Cosmic Cycle Calendar</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="js/firebase.js"></script>
  <script type="module" src="js/signup.js"></script>
</head>
<body>

  <div class="auth-box">
    <h1>Cosmic Cycle Calendar</h1>
    <h2>Sign Up</h2>

    <form id="signupForm">
      <input type="text" id="username" placeholder="Username" required>
      <input type="email" id="email" placeholder="Email" required>
      <input type="password" id="password" placeholder="Password" required>
      <input type="text" id="gender" placeholder="Gender (optional)">
      <input type="text" id="pronouns" placeholder="Pronouns (optional)">
      <input type="date" id="birthday" required>
      <button type="submit" id="signupBtn">Sign Up</button>
      <p id="signupMessage"></p>
    </form>

  </div>

  <!-- js/signup.js -->
  <script type="module">
      import { firebaseAuth, firebaseDB } from './firebase.js'; // ensure firebase.js exports these
      import { createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
      import { doc, setDoc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

      const signupForm = document.getElementById("signupForm");
      if (signupForm) {
        signupForm.addEventListener("submit", async (e) => {
          e.preventDefault();

          const username = document.getElementById("username").value.trim();
          const email = document.getElementById("email").value.trim();
          const password = document.getElementById("password").value;
          const gender = document.getElementById("gender").value.trim();
          const pronouns = document.getElementById("pronouns").value.trim();
          const birthday = document.getElementById("birthday").value;

          if (!username || !email || !password || !birthday) {
            alert("Please fill in all required fields.");
            return;
          }

          try {
            // Create user with Firebase Auth
            const userCredential = await createUserWithEmailAndPassword(firebaseAuth, email, password);
            const user = userCredential.user;

            // Update display name
            await updateProfile(user, { displayName: username });

            // Save user info to Firestore
            await setDoc(doc(firebaseDB, "users", user.uid), {
              username,
              email,
              gender,
              pronouns,
              birthday,
              photoURL: "", // optional default, can be updated later
              createdAt: new Date().toISOString()
            });

            // Show success message
            const msgEl = document.getElementById("signupMessage");
            if (msgEl) {
              msgEl.textContent = "Account created successfully! Redirecting...";
              msgEl.style.color = "lightgreen";
            }

            // Redirect to profile page after a short delay
            setTimeout(() => {
              window.location.href = "profile.html";
            }, 1200);

          } catch (error) {
            console.error("Signup error:", error);
            const msgEl = document.getElementById("signupMessage");
            if (msgEl) {
              msgEl.textContent = error.message;
              msgEl.style.color = "salmon";
            } else {
              alert(error.message);
            }
          }
        });
      }
  </script>

</body>
</html>
